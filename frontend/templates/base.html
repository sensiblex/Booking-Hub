<!doctype html>
<html lang="ru" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Booking-Hub — бронирование помещений{% endblock %}</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
  
  {% block head_extra %}{% endblock %}
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">Booking-Hub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <!-- меню будет добавляться позже -->
            <li class="nav-item"><a class="nav-link" href="#">Каталог</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Вход</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container mt-4 mb-5">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-light text-center py-4 mt-auto">
    <small>© 2026 Booking-Hub • учебный проект</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
