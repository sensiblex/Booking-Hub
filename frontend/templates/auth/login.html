{% extends 'base.html' %}
{% load static %}

{% block title %}Вход — Booking-Hub{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="card-title text-center mb-4">Вход в аккаунт</h4>

                    <form method="post" data-client-validation novalidate>
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_username" class="form-label">Имя пользователя</label>
                            <input type="text" name="username" id="id_username" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label for="id_password" class="form-label">Пароль</label>
                            <input type="password" name="password" id="id_password" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">Войти</button>
                    </form>

                    <hr class="my-4">

                    <p class="text-center mb-0">
                        Нет аккаунта? 
                        <!-- Используем жёсткую ссылку, чтобы избежать ошибки reverse -->
                        <a href="/users/register/">Зарегистрироваться</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/validation.js' %}"></script>
{% endblock %}
