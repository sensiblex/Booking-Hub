# =============================================================
# LOCAL DEV — единый compose для локального запуска
# docker compose up -d --build
# =============================================================
services:

  db:
    image: postgres:16-alpine
    container_name: booking-hub-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >-
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_spaces &&
             python manage.py runserver 0.0.0.0:8000"
    container_name: booking-hub-backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
      - media_volume:/app/media
      - static_volume:/app/static
    ports:
      - "8000:8000"
    environment:
      DEBUG: 'True'
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, urllib.error\ntry:\n    urllib.request.urlopen('http://localhost:8000/')\nexcept urllib.error.HTTPError:\n    pass\n\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  static_volume:
  media_volume:
